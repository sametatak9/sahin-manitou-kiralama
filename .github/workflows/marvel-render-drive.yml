# EMBAY · Drive ham çekimlerinden (iPhone/WhatsApp) yeni Reels — reels_drive.json. 01-12'ye dokunmaz.
name: Drive Reels kurgusu
on:
  workflow_dispatch:
    inputs:
      only: { description: 'Yalnızca bu slug ile başlayanlar (boş = hepsi)', required: false, default: '' }
  push:
    branches: [main]
    paths: ['scripts/marvel/reels_drive.json']
permissions:
  contents: write
concurrency:
  group: marvel-render-drive
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow numpy opencv-python-headless
          mkdir -p scripts/marvel/fonts
          curl -sSfL -o scripts/marvel/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sSfL -o scripts/marvel/fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf
          curl -sSfL -o scripts/marvel/fonts/Oswald-VF.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
      - name: Kaynak çekimler (yalnızca kullanılanlar)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          cfg = json.load(open('scripts/marvel/reels_drive.json'))
          need = {s[0] for r in cfg['reels'] for s in r['shots']}
          os.makedirs('scripts/marvel/src_drive', exist_ok=True)
          for it in json.load(open('scripts/marvel/sources_drive.json')):
              if it['n'] not in need: continue
              p = f"scripts/marvel/src_drive/{it['n']}.mp4"
              if not os.path.exists(p): urllib.request.urlretrieve(it['url'], p)
              print('ok', it['n'], os.path.getsize(p))
          PY
      - name: Kurgu
        run: python3 scripts/marvel/marvel.py --config reels_drive.json --src scripts/marvel/src_drive --out public/reels/marvel --only "${{ github.event.inputs.only }}"
      - name: Depoya yaz (yalnızca yeni Reels + index)
        run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          for s in $(python3 -c "import json;print(' '.join(r['slug'] for r in json.load(open('scripts/marvel/reels_drive.json'))['reels']))"); do
            git add "public/reels/marvel/$s.mp4" "public/reels/marvel/$s.jpg" 2>/dev/null || true
          done
          git add public/reels/marvel/index.json
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -q -m "Drive Reels kurgusu ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
