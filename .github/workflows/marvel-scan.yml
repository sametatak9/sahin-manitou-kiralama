name: Reels kaynak taraması
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/marvel/sources.json', 'scripts/marvel/scan.py']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null && pip install -q pillow
      - run: python3 scripts/marvel/scan.py
      - run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add scripts/marvel/scan
          git diff --cached --quiet && exit 0
          git commit -q -m "Reels kaynak taraması ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
