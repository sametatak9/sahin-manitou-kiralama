# EMBAY · "Teslim Ettiğimiz Villa Projemiz" Reels (gökyüzü mavisi kapak + gerçek proje fotoğrafları + DM kapanışı)
# Ana çıktı müziksiz: Instagram'da popüler şarkı (ör. Hepsi Aşktan) uygulama içinden eklenir. Önizleme kopyası telifsiz müzikle.
name: Teslim Villa Reels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/reels/teslim_reel.py', 'scripts/reels/video_tour.py', 'scripts/reels/reelkit.py']
permissions:
  contents: write
concurrency:
  group: teslim-reel
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow numpy
          mkdir -p scripts/marvel/fonts
          curl -sSfL -o scripts/marvel/fonts/Montserrat-VF.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
      - run: python3 scripts/reels/teslim_reel.py
      - run: python3 scripts/reels/video_tour.py
      - name: Depoya yaz
        run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add public/reels/teslim public/reels/qc
          git diff --cached --quiet && exit 0
          git commit -q -m "Teslim villa Reels ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
