name: Marka logosu
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/marvel/logo.py']
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          pip install -q pillow
          mkdir -p scripts/marvel/fonts
          curl -sSfL -o scripts/marvel/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          python3 scripts/marvel/logo.py
      - run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add public/brand
          git diff --cached --quiet && exit 0
          git commit -q -m "Marka logosu seti ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
