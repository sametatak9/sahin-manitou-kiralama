# EMBAY · Kaydırmalı gönderi (carousel) slaytları — gerçek proje fotoğraflarından, kurumsal renklerle (1080x1350)
name: Carousel slaytları
on:
  workflow_dispatch:
    inputs:
      only: { description: 'Yalnızca bu slug ile başlayanlar (boş = hepsi)', required: false, default: '' }
  push:
    branches: [main]
    paths: ['scripts/carousel/carousels.json', 'scripts/carousel/build.py', 'scripts/carousel/ev_tarzlari.json']
permissions:
  contents: write
concurrency:
  group: carousel-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          pip install -q pillow
          mkdir -p scripts/marvel/fonts
          curl -sSfL -o scripts/marvel/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          curl -sSfL -o scripts/marvel/fonts/Oswald-VF.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          curl -sSfL -o scripts/marvel/fonts/Montserrat-VF.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
      - run: python3 scripts/carousel/build.py --only "${{ github.event.inputs.only }}"
      - name: Depoya yaz
        run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add public/carousel
          git diff --cached --quiet && exit 0
          git commit -q -m "Carousel slaytları ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
