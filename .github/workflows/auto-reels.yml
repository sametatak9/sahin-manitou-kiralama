# EMBAY otomatik Reels montajı: İçerik Fabrikası'nın ham şantiye videolarını yeni Embay tarzında editler.
# Gizli anahtar gerekmez — kuyruk herkese açık video adreslerini verir; video depoya (public/reels) yazılır,
# Vercel yayınlayınca panel taslağa bağlar (yalnızca kendi alan adımızdaki dosyayı kabul eder).
name: Otomatik Reels montajı
on:
  schedule:
    - cron: '12 3-16 * * *'   # İstanbul 06:12–19:12 arası her saat
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: auto-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow
      - name: Montaj
        env:
          REELS_SUMMARY: ${{ runner.temp }}/reels.json
        run: python3 scripts/reels/render.py --out public/reels
      - name: Depoya yaz
        id: push
        run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add public/reels
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Otomatik Reels montajı ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Taslaklara bağla
        env:
          REELS_SUMMARY: ${{ runner.temp }}/reels.json
        run: |
          ids=$(python3 -c "import json,os;print(' '.join(json.load(open(os.environ['REELS_SUMMARY'])).get('rendered',[])))")
          [ -z "$ids" ] && exit 0
          for try in $(seq 1 12); do
            left=""
            for id in $ids; do
              r=$(curl -s -X POST -H 'content-type: application/json' -d "{\"id\":\"$id\"}" https://utngxnqlcayfjkknaysx.supabase.co/functions/v1/ops/reels/attach)
              echo "$id → $r"
              echo "$r" | grep -q '"attached":true\|zaten editli' || left="$left $id"
            done
            ids="$left"; [ -z "$ids" ] && break
            sleep 40
          done
