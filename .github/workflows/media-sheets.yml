# Medya kontak sayfaları: havuzdaki fotoğraf/videoların numaralı önizlemeleri (içerik etiketleme için).
name: Medya kontak sayfaları
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/media-sheets/list.json']
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null && pip install -q pillow
      - run: python3 scripts/media-sheets/build.py
      - run: |
          git config user.name "embay-reels-bot"
          git config user.email "embay-reels-bot@users.noreply.github.com"
          git add scripts/media-sheets/out
          git diff --cached --quiet && exit 0
          git commit -q -m "Medya kontak sayfaları ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
