# Yapay zekâ görsel örneği: yönetici/ajan kalite kontrolü için birkaç konsept görseli indirip depoya koyar (yayın yapmaz).
name: AI görsel önizleme
on:
  workflow_dispatch:
    inputs:
      prompts:
        description: 'Satır başına bir istem (|| ile ayrılmış)'
        required: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Görselleri indir
        env:
          PROMPTS: ${{ github.event.inputs.prompts }}
        run: |
          mkdir -p previews
          i=0
          IFS='|' read -ra P <<< "${PROMPTS//||/|}"
          for p in "${P[@]}"; do
            i=$((i+1))
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$p")
            curl -sSL -m 120 -o "previews/ai-$i.jpg" "https://image.pollinations.ai/prompt/${enc}?width=832&height=1024&model=flux&nologo=true&seed=$((i*17))" || true
            ls -la "previews/ai-$i.jpg" || true
          done
      - name: Commit
        run: |
          git config user.name "embay-reels-bot"; git config user.email "embay-reels-bot@users.noreply.github.com"
          git add previews && git commit -m "AI görsel önizleme" && (git push || (git pull --rebase && git push)) || echo "değişiklik yok"
